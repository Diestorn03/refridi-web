name: Deploy a GitHub Pages (propuesta)

# Propuesta en staging: https://<owner>.github.io/<repo>/ con noindex, marca "Vista previa" y selector de paleta.
# Activar una vez: Settings → Pages → Source: GitHub Actions.
# Para el sitio real se pasa a Cloudflare Pages (PREPARACION §1; public/_headers ya está listo para eso).
# Acciones fijadas por SHA (git ls-remote del tag, 2026-10-07); el tag va en el comentario.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false # como la plantilla oficial: nunca cortar un deploy-pages a medias

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Sitio de proyecto: https://<owner>.github.io/<repo>/ — sin PAGES_BASE cuando haya dominio propio (Q1).
          SITE_URL: https://${{ github.repository_owner }}.github.io
          PAGES_BASE: /${{ github.event.repository.name }}
          # Staging por defecto. La variable del repo PUBLIC_DEMO="off" lo apaga (vacía sería falsy en Actions y volvería a '1').
          PUBLIC_DEMO: ${{ vars.PUBLIC_DEMO != 'off' && '1' || '' }}
      # presupuesto de JS por página (≤80 KB gz, AJ3), contraste AA de los tokens y gate de higiene
      - run: npm run check
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
